# Navigation edge cases: declared vs undeclared tags, ordering, untagged operations, id collisions,
# webhooks, and headings in the description.
openapi: 3.1.0
info:
  title: Navigation
  version: 1.0.0
  description: |-
    Intro prose.

    # Getting started

    Some text.

    ## Authentication

    More text.

    ```sh
    # This is a shell comment, not a heading.
    curl https://example.com
    ```

    ## Rate limits

    # Concepts
servers:
  - url: https://{region}.example.com/v1
    variables:
      region:
        default: us
tags:
  # Declared order is deliberate and must be preserved: zebra before alpha.
  - name: zebra
    description: The zebra tag.
  - name: alpha
    x-displayName: Alpha (renamed)
  # Declared but used by no operation, so it must not appear in the navigation.
  - name: unused
paths:
  /alpha:
    get:
      summary: List alpha
      operationId: listAlpha
      tags: [alpha]
      responses:
        '200':
          description: OK
  /zebra:
    get:
      summary: List zebra
      tags: [zebra]
      responses:
        '200':
          description: OK
    post:
      # Same summary as the operation above, in the same tag: the slugs must not collide.
      summary: List zebra
      tags: [zebra]
      responses:
        '201':
          description: Created
  /multi:
    get:
      summary: In two tags
      tags: [alpha, zebra]
      responses:
        '200':
          description: OK
  /undeclared:
    get:
      summary: Undeclared tag
      tags: [omega]
      responses:
        '200':
          description: OK
  /loose:
    get:
      # No tags at all: goes to the untagged bucket, which always sorts last.
      summary: Untagged operation
      responses:
        '200':
          description: OK
    delete:
      deprecated: true
      summary: Deprecated and untagged
      responses:
        '204':
          description: No content
webhooks:
  newThing:
    post:
      summary: A thing was created
      responses:
        '200':
          description: OK
components:
  schemas:
    Alpha:
      type: object
    Beta:
      type: object
