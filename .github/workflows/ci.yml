name: CI

# The repository's first CI. `verify` is the gate: guards, typecheck, and the four Vitest projects,
# one of which needs real Chromium. Nothing deploys that has not passed it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The `elements` project runs in real Chromium: the reference needs real history, real
      # hashchange, and a `light-dark()` that resolves. A simulated DOM would only test the shim.
      - run: npx playwright install --with-deps chromium
      # `apps/site/test/examples.test.ts` validates every live example against
      # `custom-elements.json`, which is generated by this build and gitignored. Without it that
      # suite fails on a fresh checkout - which is every CI run.
      - run: npm run build -w @openish/elements
      - run: npm run verify

  build-site:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # `custom-elements.json` and `dist/standalone.js` are generated and gitignored. The site's own
      # `prebuild` runs this too; naming it here keeps the failure legible when it is the build step
      # that broke rather than the site.
      - run: npm run build -w @openish/elements
      - run: npm run build -w @openish/site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist

  # Pages → Settings → Source must be set to "GitHub Actions" once, by hand. Nothing here can do it,
  # and until it is, this job fails with an error that reads like a token problem.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
